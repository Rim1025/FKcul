<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Arknights Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>FK計算機</h1>

    <div id="app">

        <div>
            <button id="add-operator">
                ＋ オペレーター追加
            </button>
        </div>


        <h3>オペレーター</h3>
        <div id="operator-list"></div>


        <details class="global-buff-details">
            <summary>全体バフ</summary>
            <div id="global-buff-list"></div>
        </details>

        <details class="support-operator-details">
            <summary>鼓舞バフ</summary>
            <div id="support-operator-list"></div>
        </details>

    </div>
    <h2>敵ステータス</h2>

    <div id="enemy-settings">

        <label>
            HP
            <input id="enemy-hp" type="number" value="1000">
        </label>

        <label>
            防御
            <input id="enemy-def" type="number" value="300">
        </label>

        <label>
            術耐性 %
            <input id="enemy-res" type="number" value="10" min="0" max="100">
        </label>
    </div>

    <details class="debuff-details">
        <summary>敵デバフ</summary>
        <div id="enemy-debuff-list"></div>
    </details>

    <div id="final-enemy-status"></div>

    <button id="calculate-btn">
        ダメージ計算
    </button>
    <div id="result"></div>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
