<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アークナイツ ダメージ計算機</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>アークナイツ ダメージ計算機</h1>

    <div class="card">

        <div class="row">
            <label>名前</label>
            <span>オペレーター</span>
        </div>

        <div class="row">
            <label for="atk">攻撃力</label>
            <input
                type="number"
                id="atk"
                value="1000">
        </div>

        <div class="row">
            <label for="multiplier">スキル倍率</label>
            <input
                type="number"
                id="multiplier"
                value="1.5"
                step="0.1">
        </div>

        <button id="calcButton">
            計算
        </button>

        <hr>

        <h2>
            ダメージ：
            <span id="result">1500</span>
        </h2>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
